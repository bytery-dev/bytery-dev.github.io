<script>
(() => {
  const root = document.documentElement;
  const key = "bytery-theme";
  const media = matchMedia("(prefers-color-scheme: dark)");
  const saved = () => { try { return localStorage.getItem(key); } catch { return null; } };
  const stored = saved();
  if (stored === "light" || stored === "dark") root.dataset.theme = stored;
  const effective = () => root.dataset.theme || (media.matches ? "dark" : "light");
  const metas = [...document.querySelectorAll('meta[name="theme-color"]')].map((m) => [m, m.media]);
  const buttons = document.querySelectorAll(".theme-toggle");
  const paint = () => {
    const dark = effective() === "dark";
    metas.forEach(([m, query]) => {
      const isDark = /dark/.test(query);
      m.media = root.dataset.theme ? (isDark === dark ? "all" : "not all") : query;
      m.content = isDark ? "#1E1A17" : "#F7F4EF";
    });
    buttons.forEach((b) => b.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme"));
  };
  paint();
  buttons.forEach((b) => b.addEventListener("click", () => {
    const next = effective() === "dark" ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem(key, next); } catch {}
    paint();
  }));
  media.addEventListener("change", () => { if (!saved()) paint(); });
})();
</script>
</body>
